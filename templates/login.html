<!DOCTYPE html>
<html lang="en">

<head>
	<title>Wedding RSVP Login</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <h1>Sprint 1</h1>
	<h2>Wedding RSVP Management System</h2>
	<h3>Wedding RSVP Login Page</h3>
	
	<!-- My error results were not sending back to page -->
	<!-- This checks if flask sends an error and display it if it does -->
	{% if error %}
		<p>{{ error }}</p>
	{% endif %}  <!-- SHOULD UPDATE ALL OF THESE WITH flask() IN FUTURE WHERE APPROPRIATE-->

    <div class="form-box">

		<!-- metod="POST" is sending typed information to my py flask -->
		<!-- "POST" is a specific meathod and must use this word -->
        <form method="POST">
            <label for="email">Enter invitation email here:</label>

            <br><br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
            >

            <br><br>

            <button type="submit">Login</button>
        </form>

    </div>

</body>

</html>
